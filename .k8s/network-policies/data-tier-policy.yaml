---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-tier-policy
  namespace: pmoves
  labels:
    tier: data
    app.kubernetes.io/part-of: pmoves
spec:
  podSelector:
    matchLabels:
      tier: data
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow connections from app-tier services
  - from:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: app
    ports:
    - protocol: TCP
      port: 6333  # Qdrant
    - protocol: TCP
      port: 7474  # Neo4j HTTP
    - protocol: TCP
      port: 7687  # Neo4j Bolt
    - protocol: TCP
      port: 7700  # Meilisearch
    - protocol: TCP
      port: 9000  # MinIO API
    - protocol: TCP
      port: 8123  # ClickHouse
  # Allow connections from api-tier services (direct gateway access)
  - from:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: api
    ports:
    - protocol: TCP
      port: 6333
    - protocol: TCP
      port: 7474
    - protocol: TCP
      port: 7687
    - protocol: TCP
      port: 7700
    - protocol: TCP
      port: 9000
  # Allow monitoring tier to scrape metrics
  - from:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: monitoring
    ports:
    - protocol: TCP
      port: 9090  # Metrics endpoint (if exposed)
  egress:
  # NO EGRESS ALLOWED - Data tier cannot initiate outbound connections
  # This prevents data exfiltration and limits attack surface
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
