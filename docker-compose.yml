version: '3.8'

services:
  # LiteLLM Proxy Service
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest # Use the official LiteLLM image from GitHub Container Registry
    container_name: litellm-proxy
    ports:
      - "4000:4000" # Map the proxy port
    volumes:
      - ./litellm_proxy_config/config.yaml:/app/config.yaml # Mount the config file
    env_file:
      - ./backend/app/.env # Load environment variables (including API keys)
    environment:
      # Ensure the master key is passed securely if needed for proxy features
      # LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY} # Example if you add this to your .env
      # Set the config path explicitly
      CONFIG_PATH: /app/config.yaml
    networks:
      - pmoves-network

  # Backend Application Service
  backend:
    build: ./backend # Build from the Dockerfile in the backend directory
    container_name: pmoves-backend
    ports:
      - "8000:8000" # Map the backend application port
    env_file:
      - ./backend/app/.env # Load environment variables
    volumes:
      - ./backend/app:/usr/src/app # Mount the backend application code (for development)
    depends_on:
      litellm-proxy:
        condition: service_started # Ensure LiteLLM proxy is started before starting backend
      minio:
        condition: service_started # Backend depends on MinIO
      crawl4ai:
        condition: service_healthy
    networks:
      - pmoves-network
    # Command to run the FastAPI application
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # MinIO Service (S3 Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: pmoves-minio
    ports:
      - "9000:9000" # MinIO API port
      - "9001:9001" # MinIO Console port
    env_file:
      - ./backend/app/.env # Load environment variables including MinIO credentials
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BROWSER: "on" # Enable the MinIO browser UI
    volumes:
      - minio_data:/data # Persistent data volume
    command: server /data --console-address ":9001"
    networks:
      - pmoves-network

  # Crawl4AI Service
  crawl4ai:
    image: unclecode/crawl4ai:latest # Use pre-built image from Docker Hub
    container_name: pmoves-crawl4ai
    ports:
      - "11235:11235" # FastAPI service port
    volumes:
      - ./deployment/crawl4ai/config.yml:/app/config.yml # Mount config.yml
      # The .llm.env volume mount is generally not needed if routing via LiteLLM
      # - ./deployment/crawl4ai/.llm.env:/app/.llm.env
      # Optional: Mount a volume for crawl4ai cache if you want persistence
      # - crawl4ai_cache:/home/appuser/.crawl4ai/cache
    shm_size: '1g' # Recommended for Playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - pmoves-network
    depends_on:
      - litellm-proxy # Crawl4AI depends on LiteLLM

  # Pipecat Core Service (Communication Layer & Orchestrator)
  pipecat:
    build:
      context: ./pmoves-pipecat # Build from the Dockerfile in the pmoves-pipecat directory
    container_name: pmoves-pipecat
    ports:
      - "8080:8080" # Core service API port
      - "8081:8081" # WebSocket port for agent communication
    env_file:
      - ./backend/app/.env # Load environment variables
    environment:
      # Core service configuration
      - PIPECAT_SERVICE_PORT=8080
      - PIPECAT_WEBSOCKET_PORT=8081
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - AGENT_REGISTRY_URL=http://backend:8000/agents
      - MAX_AGENTS=10
      # Multimodal capabilities (add these to your .env file)
      - DAILY_API_KEY=${DAILY_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Supabase integration
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    networks:
      - pmoves-network
    restart: unless-stopped
    depends_on:
      litellm-proxy:
        condition: service_started # Pipecat depends on LiteLLM
      backend:
        condition: service_started # For agent registry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Pipecat Agent Service (Supabase Agent Instance)
  pipecat-agent:
    build:
      context: ./pmoves-pipecat-agent # Build from the Dockerfile in the pmoves-pipecat-agent directory
    container_name: pmoves-pipecat-agent
    env_file:
      - ./backend/app/.env # Load environment variables from backend
    environment:
      # Agent-specific configuration
      - AGENT_TYPE=supabase
      - AGENT_NAME=SupabaseAgent
      - CALL_WORD=@SupabaseAgent
      - CHAT_CHANNEL=main-room
      - AVATAR_URL=https://example.com/supabase-agent-avatar.png
      - PIPECAT_SERVICE_URL=http://pipecat:8080
      - PIPECAT_WS_URL=ws://pipecat:8081
      - PORT=8000
    ports:
      - "8001:8000" # Map the agent port
    networks:
      - pmoves-network
    restart: unless-stopped
    depends_on:
      pipecat:
        condition: service_started # Agent depends on core pipecat service
      backend:
        condition: service_started # For environment variables
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Supabase Agent Service (Database Management Agent)
  supabase-agent:
    build:
      context: ./supabase-agent # Build from the Dockerfile in the supabase-agent directory
    container_name: pmoves-supabase-agent
    ports:
      - "8002:8002" # FastAPI service port
    env_file:
      - ./backend/app/.env # Use the same environment file as other services
    environment:
      # Container-specific overrides
      - AGENT_ENDPOINT_URL=http://supabase-agent:8002
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - AGENT_REGISTRY_URL=http://backend:8000/agents
      # Supabase specific settings
      - AGENT_PORT=8002
    volumes:
      # Optional: Mount for development
      - ./supabase-agent/app:/app/app
    networks:
      - pmoves-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      litellm-proxy:
        condition: service_started # Ensure LiteLLM proxy is started
      backend:
        condition: service_started # For agent registration
      # Add other dependencies as needed

volumes:
  supabase_db_data:
  minio_data:

networks:
  pmoves-network:
    driver: bridge
