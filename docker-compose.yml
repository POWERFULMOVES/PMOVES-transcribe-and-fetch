# =============================================================================
# PMOVES-transcribe-and-fetch Docker Compose
# =============================================================================
# Network Tiers:
#   - transcribe_api (172.31.1.0/24): API services (backend, frontend)
#   - transcribe_app (172.31.2.0/24): Application workers (crawl4ai, pipecat)
#   - pmoves_bus (external): Parent NATS bus (when docked)
#   - pmoves_data (external): Parent data tier (when docked)
#
# Profiles:
#   - (default): backend, frontend
#   - llm: litellm-proxy
#   - crawl: crawl4ai
#   - voice: pipecat
#   - agents: supabase-agent
#
# Usage:
#   Standalone: docker compose up -d
#   With LLM:   docker compose --profile llm up -d
#   Full stack: docker compose --profile llm --profile crawl --profile voice --profile agents up -d
#   Docked:     DOCKED_MODE=true docker compose up -d
# =============================================================================

# --- Tier Environment Anchors ---
x-env-tier-api: &tier-api
  env_file:
    - env.shared
    - env.tier-api

x-env-tier-worker: &tier-worker
  env_file:
    - env.shared
    - env.tier-worker

x-env-tier-llm: &tier-llm
  env_file:
    - env.shared
    - env.tier-llm

x-env-tier-media: &tier-media
  env_file:
    - env.shared
    - env.tier-media

# --- Common Healthcheck ---
x-healthcheck-default: &healthcheck-default
  interval: ${HEALTHCHECK_INTERVAL:-30s}
  timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  retries: ${HEALTHCHECK_RETRIES:-3}
  start_period: ${HEALTHCHECK_START_PERIOD:-30s}

services:
  # =========================================================================
  # API Tier Services
  # =========================================================================
  backend:
    <<: *tier-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pmoves-transcribe-backend
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_BACKEND_HOST_PORT:-8000}:${TRANSCRIBE_BACKEND_INTERNAL_PORT:-8000}"
    environment:
      - DOCKED_MODE=${DOCKED_MODE:-false}
      - DB_BACKEND=${DB_BACKEND:-sqlite}
      - SUPABASE_DUAL_WRITE=${SUPABASE_DUAL_WRITE:-false}
      - AGENT_ZERO_MCP_ENABLED=${AGENT_ZERO_MCP_ENABLED:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:448,http://127.0.0.1:448}
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm-proxy:4000}
      - CRAWL4AI_SERVICE_URL=${CRAWL4AI_SERVICE_URL:-http://crawl4ai:11235}
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIBE_BACKEND_INTERNAL_PORT:-8000}/healthz"]
    # GPU support for Whisper transcription (requires NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      transcribe_api:
        aliases:
          - backend
          - transcribe-backend
      # Backend needs access to app tier for litellm-proxy and crawl4ai
      transcribe_app:
        aliases:
          - backend

  frontend:
    <<: *tier-api
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmoves-transcribe-frontend
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_FRONTEND_HOST_PORT:-448}:${TRANSCRIBE_FRONTEND_INTERNAL_PORT:-448}"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:${TRANSCRIBE_BACKEND_HOST_PORT:-8000}
      - INTERNAL_BACKEND_URL=http://backend:${TRANSCRIBE_BACKEND_INTERNAL_PORT:-8000}
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${TRANSCRIBE_FRONTEND_INTERNAL_PORT:-448}/"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      transcribe_api:
        aliases:
          - frontend
          - transcribe-frontend

  # =========================================================================
  # LLM Tier Services (Profile: llm)
  # =========================================================================
  litellm-proxy:
    <<: *tier-llm
    image: litellm/proxy:latest
    container_name: pmoves-transcribe-litellm
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_LITELLM_HOST_PORT:-4000}:${TRANSCRIBE_LITELLM_INTERNAL_PORT:-4000}"
    volumes:
      - ./litellm_proxy_config/config.yaml:/app/config.yaml:ro
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIBE_LITELLM_INTERNAL_PORT:-4000}/health"]
    networks:
      transcribe_app:
        aliases:
          - litellm-proxy

  # =========================================================================
  # Worker Tier Services (Profile: crawl)
  # =========================================================================
  crawl4ai:
    <<: *tier-worker
    build:
      context: ./deployment/crawl4ai
      dockerfile: Dockerfile.custom
    container_name: pmoves-transcribe-crawl4ai
    profiles: ["crawl"]
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_CRAWL4AI_HOST_PORT:-11235}:${TRANSCRIBE_CRAWL4AI_INTERNAL_PORT:-11235}"
    volumes:
      - ./deployment/crawl4ai/config.yml:/app/config.yml:ro
      - crawl4ai_hf_cache:/home/appuser/.cache/huggingface
      - crawl4ai_internal_cache:/home/appuser/.crawl4ai
    shm_size: '1g'
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIBE_CRAWL4AI_INTERNAL_PORT:-11235}/health"]
    networks:
      transcribe_app:
        aliases:
          - crawl4ai

  # =========================================================================
  # Media Tier Services (Profile: voice)
  # =========================================================================
  pipecat:
    <<: *tier-media
    build:
      context: ./pmoves-pipecat
      dockerfile: Dockerfile
    container_name: pmoves-transcribe-pipecat
    profiles: ["voice"]
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_PIPECAT_HOST_PORT:-8080}:${TRANSCRIBE_PIPECAT_INTERNAL_PORT:-8080}"
    environment:
      - LITELLM_PROXY_URL=http://litellm-proxy:${TRANSCRIBE_LITELLM_INTERNAL_PORT:-4000}
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${TRANSCRIBE_PIPECAT_INTERNAL_PORT:-8080}/health', timeout=5)"]
    depends_on:
      litellm-proxy:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    networks:
      transcribe_app:
        aliases:
          - pipecat

  # =========================================================================
  # Agent Tier Services (Profile: agents)
  # =========================================================================
  supabase-agent:
    <<: *tier-worker
    build:
      context: ./supabase-agent
      dockerfile: Dockerfile
    container_name: pmoves-transcribe-supabase-agent
    profiles: ["agents"]
    restart: unless-stopped
    ports:
      - "${TRANSCRIBE_SUPABASE_AGENT_HOST_PORT:-8002}:${TRANSCRIBE_SUPABASE_AGENT_INTERNAL_PORT:-8002}"
    environment:
      - AGENT_ENDPOINT_URL=http://supabase-agent:${TRANSCRIBE_SUPABASE_AGENT_INTERNAL_PORT:-8002}
      - LITELLM_PROXY_URL=http://litellm-proxy:${TRANSCRIBE_LITELLM_INTERNAL_PORT:-4000}
      - AGENT_REGISTRY_URL=http://backend:${TRANSCRIBE_BACKEND_INTERNAL_PORT:-8000}/agents
    volumes:
      - ./supabase-agent/app:/app/app:ro
    healthcheck:
      <<: *healthcheck-default
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIBE_SUPABASE_AGENT_INTERNAL_PORT:-8002}/health"]
    depends_on:
      litellm-proxy:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      pipecat:
        condition: service_healthy
    networks:
      transcribe_app:
        aliases:
          - supabase-agent

# =============================================================================
# Volumes
# =============================================================================
volumes:
  crawl4ai_hf_cache: {}
  crawl4ai_internal_cache: {}

# =============================================================================
# Networks
# =============================================================================
networks:
  # Internal API tier network
  transcribe_api:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24

  # Internal application tier network
  transcribe_app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24

  # External networks for docked mode (connect to parent PMOVES.AI)
  # These are only used when DOCKED_MODE=true
  # pmoves_bus:
  #   external: true
  #   name: pmoves_bus
  # pmoves_data:
  #   external: true
  #   name: pmoves_data
