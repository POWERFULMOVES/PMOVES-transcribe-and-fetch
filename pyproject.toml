[project]
name = "pmoves-transcribe-and-fetch"
version = "0.1.0"
description = "A powerful web application that transcribes YouTube videos and fetches content using multiple AI models"
requires-python = ">=3.12"
authors = [
    {name = "Russell", email = "russell@example.com"}
]
dependencies = [
    "yt-dlp",
    "fastapi",
    "uvicorn",
    "python-dotenv==1.1.0",
    "openai>=1.50.0,<3.0.0",
    "groq",
    "litellm>=1.53.1",
    "pydantic>=2.10",
    "aiohttp>=3.11.11",
    "playwright>=1.49.0",
    "beautifulsoup4==4.13.4",
    "lxml==5.4.0",
    "numpy>=1.26.0",
    "rank-bm25==0.2.2",
    "tf-playwright-stealth>=1.1.0",
    "python-multipart",
    "sse-starlette",
    "weasyprint",
    "pdfkit",
    "faster-whisper",
    "torch",
    "torchaudio",
    "torchvision",
    "supabase",
    "pandas",
    "openpyxl",
    "markdown",
    "markdown2",
    "python-markdown-math",
    "python-frontmatter",
    "pydub",
    "mutagen",
    "av",
    "ctranslate2",
    "onnxruntime",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "scipy",
    "aiofiles>=24.1.0",
    "aiohappyeyeballs>=2.5.0",
    "aiosignal",
    "annotated-types",
    "anyio",
    "asyncpg",
    "attrs",
    "Brotli>=1.1.0",
    "certifi",
    "cffi",
    "chardet>=5.2.0",
    "charset-normalizer",
    "click>=8.1.7",
    "colorama~=0.4",
    "coloredlogs",
    "cssselect2",
    "cssselect>=1.2.0",
    "deprecation",
    "distro",
    "et_xmlfile",
    "filelock",
    "flatbuffers",
    "fonttools",
    "frozenlist",
    "fsspec",
    "gotrue",
    "h11",
    "h2",
    "hpack",
    "html5lib",
    "httpcore",
    "httpx>=0.27.2",
    "huggingface-hub",
    "humanfriendly",
    "hyperframe",
    "idna",
    "Jinja2",
    "jiter",
    "Markdown",
    "markdown-it-py",
    "MarkupSafe",
    "mdurl",
    "mpmath",
    "multidict",
    "networkx",
