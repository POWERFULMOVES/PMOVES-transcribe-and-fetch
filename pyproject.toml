    "pycparser",
    "pycryptodomex",
    "pydantic_core",
    "pydyf",
    "Pygments",
    "pyphen",
    "pyreadline3",
    "python-dateutil",
    "pytz",
    "PyYAML",
    "realtime",
    "regex",
    "reportlab",
    "requests==2.32.4",
    "rich>=13.9.4",
    "six",
    "sniffio",
    "storage3",
    "supafunc",
    "sympy",
    "tabulate",
    "tiktoken",
