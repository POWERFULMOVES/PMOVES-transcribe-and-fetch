    "pytest-cov",
    "hypothesis",
    "pytest-mock",
    "pytest-xdist",
    "pyjwt>=2.10.1",
]

[project.optional-dependencies]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest",
    "pytest-asyncio"
]

[tool.uv]
# Note: Run post_sync.ps1 or post_sync.sh after `uv sync` to install PyTorch CUDA

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --tb=short --maxfail=5"
