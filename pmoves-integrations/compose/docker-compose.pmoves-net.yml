services:
  backend:
    networks:
      - default
      - pmoves-net
    environment:
      - DOCKED_MODE=true
      - DB_BACKEND=supabase
      - SUPABASE_DUAL_WRITE=true
      - AGENT_ZERO_MCP_ENABLED=true
      - TRANSCRIBE_ARCHON_ENABLED=true
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPA_REST_URL=${SUPA_REST_URL:-http://host.docker.internal:54321/rest/v1}
      - ARCHON_URL=http://archon-server:8051
      - HIRAG_URL=http://hi-rag-gateway-v2-cpu:8086
      - HIRAG_GPU_URL=http://hi-rag-gateway-v2-gpu:8086
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:pmoves@nats:4222

  frontend:
    networks:
      - default
      - pmoves-net

  litellm-proxy:
    networks:
      - default
      - pmoves-net

  supabase-agent:
    networks:
      - default
      - pmoves-net

networks:
  pmoves-net:
    external: true
