version: '3.8'

services:
  litellm-proxy:
    # Replace with your LiteLLM service definition
    image: litellm/proxy:latest
    ports:
      - "4000:4000"
    volumes:
      # Mount your LiteLLM proxy config
      - ./litellm_proxy_config/config.yaml:/app/config.yaml
      # Mount your LiteLLM environment file for API keys
      - ./.env.litellm:/app/.env
    restart: unless-stopped
    networks:
      - pmoves-network

  crawl4ai:
    build:
      context: ./deployment/crawl4ai
      dockerfile: Dockerfile.custom
    ports:
      - "11235:11235"
    volumes:
      # Mount config.yml from your project's config directory
      # Update the path below to match your project structure
      - ./deployment/crawl4ai/config.yml:/app/config.yml
      - crawl4ai_hf_cache:/home/appuser/.cache/huggingface
      - crawl4ai_internal_cache:/home/appuser/.crawl4ai
      # The .llm.env volume mount is generally not needed if routing via LiteLLM
      # - ./deployment/crawl4ai/.llm.env:/app/.llm.env
      # Optional: Mount a volume for crawl4ai cache if you want persistence
      # - crawl4ai_cache:/home/appuser/.crawl4ai/cache
    shm_size: '1g' # Recommended for Playwright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - pmoves-network

  pipecat:
    # Replace with your Pipecat service definition
    build:
      context: ./pmoves-pipecat
      dockerfile: Dockerfile
    # Define ports, volumes, environment variables as needed
    # ports:
    #   - "your_pipecat_port:your_pipecat_port"
    # volumes:
    #   - ./your_pipecat_config:/app/config
    environment:
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      # Add other necessary Pipecat env vars here
    restart: unless-stopped
    depends_on:
      - litellm-proxy
      - crawl4ai
    # Add healthcheck if needed
    networks:
      - pmoves-network

  supabase-agent:
    # Fixed build context to point to the correct supabase-agent directory
    build:
      context: ./supabase-agent
      dockerfile: Dockerfile
    container_name: pmoves-supabase-agent
    ports:
      - "8002:8002"
    env_file:
      - ./supabase-agent/.env
    environment:
      # Container-specific overrides
      - AGENT_ENDPOINT_URL=http://supabase-agent:8002
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - AGENT_REGISTRY_URL=http://backend:8000/agents
    volumes:
      # Optional: Mount for development
      - ./supabase-agent/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - litellm-proxy
      - crawl4ai
      - pipecat
    # Add Supabase dependency here if running Supabase as a service
    # - supabase
    networks:
      - pmoves-network

# Optional: Define named volumes
# volumes:
#   crawl4ai_cache:
volumes:
  crawl4ai_hf_cache: {}
  crawl4ai_internal_cache: {}
networks:
  pmoves-network:
    driver: bridge