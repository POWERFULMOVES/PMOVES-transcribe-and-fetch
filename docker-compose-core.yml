version: '3.8'

services:
  litellm-proxy:
    image: litellm/proxy:latest
    container_name: pmoves-litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_proxy_config/config.yaml:/app/config.yaml:ro
      - ./.env.litellm:/app/.env:ro
    restart: unless-stopped
    # Security hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=100M,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - pmoves-network

  crawl4ai:
    build:
      context: ./deployment/crawl4ai
      dockerfile: Dockerfile.custom
    container_name: pmoves-crawl4ai
    ports:
      - "11235:11235"
    volumes:
      - ./deployment/crawl4ai/config.yml:/app/config.yml:ro
      - crawl4ai_hf_cache:/home/appuser/.cache/huggingface
      - crawl4ai_internal_cache:/home/appuser/.crawl4ai
    shm_size: '1g'
    restart: unless-stopped
    # Security hardening
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN  # Required for Playwright/Chrome sandbox
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined  # Required for Chrome
    tmpfs:
      - /tmp:size=500M,mode=1777
      - /home/appuser/.local:size=100M,mode=0755
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - pmoves-network

  pipecat:
    build:
      context: ./pmoves-pipecat
      dockerfile: Dockerfile
    container_name: pmoves-pipecat
    environment:
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
    restart: unless-stopped
    depends_on:
      litellm-proxy:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    # Security hardening
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=200M,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - pmoves-network

  supabase-agent:
    build:
      context: ./supabase-agent
      dockerfile: Dockerfile
    container_name: pmoves-supabase-agent
    ports:
      - "8002:8002"
    env_file:
      - ./supabase-agent/.env
    environment:
      - AGENT_ENDPOINT_URL=http://supabase-agent:8002
      - LITELLM_PROXY_URL=http://litellm-proxy:4000
      - AGENT_REGISTRY_URL=http://backend:8000/agents
    volumes:
      - ./supabase-agent/app:/app/app:ro
    restart: unless-stopped
    # Security hardening
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=200M,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      litellm-proxy:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
      pipecat:
        condition: service_healthy
    networks:
      - pmoves-network

volumes:
  crawl4ai_hf_cache: {}
  crawl4ai_internal_cache: {}

networks:
  pmoves-network:
    driver: bridge
