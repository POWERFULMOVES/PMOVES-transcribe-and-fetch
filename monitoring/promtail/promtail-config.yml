server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+):\s+(?P<message>.*)$'
      - timestamp:
          format: Jan 2 15:04:05
          source: timestamp
      - labels:
          hostname:
          service:

  # PMOVES Backend logs
  - job_name: pmoves-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/pmoves-backend'
        target_label: '__tmp_docker_container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/pmoves-backend'
        target_label: 'container'
        replacement: 'pmoves-backend'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            module: name
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          module:

  # PMOVES Agents logs
  - job_name: pmoves-agents
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/.*agent.*'
        target_label: '__tmp_docker_container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*agent.*)'
        target_label: 'container'
        replacement: '${1}'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            agent_type: agent_type
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          agent_type:

  # Pipecat service logs
  - job_name: pipecat
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/pipecat'
        target_label: '__tmp_docker_container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/pipecat'
        target_label: 'container'
        replacement: 'pipecat'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            component: component
      - timestamp:
          format: RFC3339
          source: timestamp
      - labels:
          level:
          component: 